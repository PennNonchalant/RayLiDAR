camera: image_00
resolution: [1408, 376]
seed: 20261102

method:
  gs3d:
    upstream_subdir: gaussian-splatting
    iterations: 30000
    resolution: -1
    smoke_iterations: 100
    smoke_frames: [1820, 1821]
