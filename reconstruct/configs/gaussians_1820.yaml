  depth_convention: z_depth
  pixel_rounding: half_up
  depth_probe_frame: 1820
  depth_probe_stride: 97
  primary_camera: 0
  report_all_frames: true

eval:
  protocol_config: reconstruct/configs/eval.yaml
  protocol_doc: reconstruct/configs/eval_protocol.md
  modes: [all, unoccluded]

report:
  title: "3DGS vs 2DGS on KITTI-360 frames 1820–1879"
  labels: [training-view, not-NVS, rendered-depth-proxy, single-seed]
