schema_version: 1
phase: 2
status: preregistered
run_id: p2-60f-step10
supersedes:
  frozen_at_utc: "2026-10-31T05:35:58Z"
  sidecar: artifacts/01/decisions.sha256.prev
sequence_policy:
  candidate_sequences: [2013_05_28_drive_0000_sync]
  criteria:
    - lowest point-weighted dynamic fraction over a 60-frame window
    - evaluated at step 10 over the full sorted usable-frame index
    - dynamic points are the union of 3D dynamic bboxes and 2D semantic dynamic classes after ego ROI removal
    - at least 60 usable frames and at least 20000 valid rays per frame
  tie_break: earliest_window
  forbidden: selecting by reconstruction error, metric value, or visual mesh quality

frame_window:
  window_frames: 60
  step_frames: 10
  exact_frames: 60
  min_frames: 60
  max_frames: 60
  min_evaluated_frames: 60
  min_valid_rays_per_frame: 20000
  policy: "lowest point-weighted dynamic fraction after ego removal over every 60-frame window at step 10"

dynamic_scoring:
  sources: [3d_bboxes, 2d_semantics]
  union: true
  point_weighted: true
  after_ego_removal: true

taus_m: [0.05, 0.20, 0.50]
primary_tau_m: 0.20
distance_semantics: true_euclidean

buckets:
  primary: [[0.0, 20.0], [20.0, 40.0], [40.0, 50.0]]
  secondary: [[50.0, 60.0]]
  edge_rule: closed_on_right_for_primary_40_50_and_secondary_50_60

exclusions:
  dynamic_classes: [car, truck, bus, motorcycle, bicycle, person, rider]
  ego_roi_velodyne_m:
    x: [-2.5, 2.5]
    y: [-1.2, 1.2]
    z: [-2.0, 0.3]
  min_range_m: 1.5
  max_range_m: 60.0
  image_margin_px: 5
  occluded_variant: reported_separately

metrics:
  primary: range_rmse_hits_micro
  paired_with: ray_recall_and_coverage
  secondary: [cd_l1_m, f_score_at_tau_0_20]
  aggregation: micro_over_pooled_rays_plus_macro_per_frame

protocol_change_policy: new_hash_and_new_run_id_required
